name: Build FIT3D APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP, Generate Gradle Wrapper and Build APK
        run: |
          unzip fit3d.zip -d my_app
          cd my_app
          # Install gradle to generate the missing wrapper
          sudo apt-get update && sudo apt-get install -y gradle
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: my_app/app/build/outputs/apk/debug/app-debug.apk
